name: Daily AI Autonomous Dev & PR Pipeline

on:
  schedule:
    # 毎日午前9時（JST = UTC 0:00）に自動実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動でもいつでも実行可能

jobs:
  daily-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Step 1. AGENTS.md & FRONTEND_SPEC.md の読み込みと分析
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== 1. コンテキストの確認 ==="
          if [ -f "AGENTS.md" ]; then cat AGENTS.md; fi
          if [ -f "FRONTEND_SPEC.md" ]; then cat FRONTEND_SPEC.md; fi

          echo "=== 2. AI アナライザーによるタスク選定・追加 ==="
          node scripts/weekly-ai-analyzer.js

      - name: Step 2. 1案件の自動実装 (Auto-Coder)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== 3. COPILOT_TASK.md の未完了タスクを1件ピックアップして実装 ==="
          if [ -f "scripts/auto-coder.js" ]; then
            node scripts/auto-coder.js
          else
            echo "scripts/auto-coder.js が存在しないため、コード自動実装ステップをスキップします。"
          fi

      - name: Step 3. 自動テスト & ビルド検証
        run: |
          echo "=== 4. 型チェックとビルドの実行 ==="
          npx tsc --noEmit
          npm run build

      - name: Check for codebase changes
        id: git-check
        run: |
          git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request for Daily Task
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: '🤖 【全自動AI開発】本日の改善案件の実装と仕様書更新'
          commit-message: 'feat(auto): 毎日のAI自動開発パイプラインによる案件実装・ビルド検証完了'
          branch: 'daily-auto-dev'
          body: |
            毎日の定期実行により、AIが `AGENTS.md` および `FRONTEND_SPEC.md` の仕様に沿って1案件を実装し、ビルド検証を通過させました。
            実装された機能のコード差分および `FRONTEND_SPEC.md` の更新内容を確認し、問題なければマージしてください。
          delete-branch: true