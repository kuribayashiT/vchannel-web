name: Daily AI Autonomous Dev & PR Pipeline

on:
  schedule:
    # 毎日午前9時（JST = UTC 0:00）に自動実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動でもいつでも実行可能

jobs:
  daily-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Debug - 利用可能なモデルの確認
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node -e '
            import("@anthropic-ai/sdk").then(async ({ default: Anthropic }) => {
              const anthropic = new Anthropic({ apiKey: process.env.ANTHROPIC_API_KEY });
              try {
                const response = await anthropic.models.list();
                console.log("=== 利用可能なモデル一覧 ===");
                console.log(response.data.map(m => m.id));
              } catch (e) {
                console.error("モデル一覧の取得に失敗しました:", e.message);
                const testModels = [
                  "claude-3-7-sonnet-20250219",
                  "claude-3-5-sonnet-20241022",
                  "claude-3-5-haiku-20241022",
                  "claude-3-opus-20240229"
                ];
                for (const model of testModels) {
                  try {
                    process.stdout.write(`Testing ${model}... `);
                    await anthropic.messages.create({
                      model: model,
                      max_tokens: 10,
                      messages: [{ role: "user", content: "ping" }]
                    });
                    console.log("✅ 利用可能！");
                  } catch (err) {
                    console.log(`❌ エラー: ${err.error?.message || err.message}`);
                  }
                }
              }
            });
          '

      - name: Step 1. AGENTS.md & FRONTEND_SPEC.md の読み込みと分析
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== 1. コンテキストの確認 ==="
          if [ -f "AGENTS.md" ]; then cat AGENTS.md; fi
          if [ -f "FRONTEND_SPEC.md" ]; then cat FRONTEND_SPEC.md; fi

          echo "=== 2. AI アナライザーによるタスク選定・追加 ==="
          node scripts/weekly-ai-analyzer.js

      - name: Step 2. 1案件の自動実装 (Auto-Coder)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== 3. COPILOT_TASK.md の未完了タスクを1件ピックアップして実装 ==="
          if [ -f "scripts/auto-coder.js" ]; then
            node scripts/auto-coder.js
          else
            echo "scripts/auto-coder.js が存在しないため、コード自動実装ステップをスキップします。"
          fi

      - name: Step 3. 自動テスト & ビルド検証 (セルフヒーリング付き & フォールバック完備)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MAX_RETRIES=3
          attempt=1
          success=false
          
          while [ $attempt -le $MAX_RETRIES ]; do
            echo "=== ビルド検証 試行回数: $attempt / $MAX_RETRIES ==="
            
            if npx tsc --noEmit && npm run build; then
              echo "✅ ビルド & 型チェック成功！"
              success=true
              break
            else
              echo "❌ ビルドまたは型チェックが失敗しました。AIによる自動修復を試みます..."
              npx tsc --noEmit > tsc_errors.log 2>&1 || true
              
              node scripts/auto-fixer.js
              attempt=$((attempt + 1))
            fi
          done
          
          # 3回試行してもダメだった場合のフォールバック処理
          if [ "$success" = "false" ]; then
            echo "⚠️ 最大リトライ回数を超えました。変更をロールバックし、COPILOT_TASK.md を別アプローチに修正します..."
            
            # 1. ソースコードを元に戻す（未追跡ファイルや変更を破棄）
            git checkout .
            git clean -fd
            
            # 2. 失敗したエラーを元に、COPILOT_TASK.md のタスク内容を別アプローチに修正するスクリプトを実行
            node scripts/task-fallback.js
            
            echo "❌ 今回の自動実装は中断されましたが、タスクを別のアプローチに書き換えました。"
            exit 1
          fi

      - name: Check for codebase changes
        id: git-check
        run: |
          git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request for Daily Task
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '🤖 【全自動AI開発】本日の改善案件の実装と仕様書更新'
          commit-message: 'feat(auto): 毎日のAI自動開発パイプラインによる案件実装・ビルド検証完了'
          branch: 'daily-auto-dev'
          body: |
            毎日の定期実行により、AIが `AGENTS.md` および `FRONTEND_SPEC.md` の仕様に沿って1案件を実装し、ビルド検証を通過させました。
            実装された機能のコード差分および `FRONTEND_SPEC.md` の更新内容を確認し、問題なければマージしてください。
          delete-branch: true